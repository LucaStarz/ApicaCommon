name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apica-common-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, tag and release version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run tests
        run: zig build test --summary all

      - name: Detect version change and create tag
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(
            sed -nE \
              's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              build.zig.zon | head -n 1
          )

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version in build.zig.zon: $CURRENT_VERSION"
            exit 1
          fi

          git fetch --tags origin

          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          LATEST_VERSION="${LATEST_TAG#v}"

          if [[ "$CURRENT_VERSION" == "$LATEST_VERSION" ]]; then
            echo "Version unchanged ($CURRENT_VERSION == $LATEST_TAG). No tag or release required."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v${CURRENT_VERSION}"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "ApicaCommon $TAG"
          git push origin "$TAG"

          echo "Successfully created tag $TAG (previous: ${LATEST_TAG:-none})"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version_check.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version_check.outputs.tag }}
          VERSION: ${{ steps.version_check.outputs.version }}
        run: |
          set -euo pipefail

          NOTES=""
          if [[ -f CHANGELOG.md ]]; then
            NOTES=$(awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md)
          fi

          if [[ -n "$NOTES" ]]; then
            gh release create "$TAG" \
              --title "ApicaCommon $TAG" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              --title "ApicaCommon $TAG" \
              --generate-notes
          fi
