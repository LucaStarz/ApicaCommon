name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src/ tests/

      - name: Run tests
        run: zig build test
